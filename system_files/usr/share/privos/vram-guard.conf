# Standard-Einstellungen für privos-vram-guard.
# Eigene Anpassungen gehören nach /etc/privos/vram-guard.conf (gleiches Format, nur geänderte Werte).

[guard]
# notify     = nur warnen, nie etwas beenden
# balanced   = nur eingreifen, wenn das System wirklich einzufrieren droht (Standard)
# aggressive = zusätzlich eingreifen, wenn VRAM lange über critical_percent liegt
mode = balanced

# Wie oft der VRAM geprüft wird (Sekunden)
poll_interval = 1.0

# Warnung, wenn der VRAM so lange über diesem Wert liegt
warn_percent = 90
warn_seconds = 5
warn_cooldown = 120

# Notfall 1: VRAM über critical_percent UND Speicherdruck (PSI) für critical_seconds
critical_percent = 97
critical_seconds = 3
psi_full_avg10 = 10
psi_some_avg10 = 40

# Notfall 2: VRAM komplett voll (weniger als critical_free_mib frei) für exhausted_seconds
critical_free_mib = 150
exhausted_seconds = 8

# Nur im Modus "aggressive": VRAM über critical_percent für so viele Sekunden
aggressive_seconds = 20

# Wartezeit zwischen SIGTERM und SIGKILL, und Mindestabstand zwischen zwei Eingriffen
kill_grace_seconds = 3
action_cooldown = 15

# Apps mit weniger VRAM werden nie beendet; Systemprozesse (UID < min_uid) auch nicht
min_victim_mib = 256
min_uid = 1000

# Werden NIE beendet (Prozessname, Programmname oder .exe-Name)
protected = kwin_wayland, kwin_x11, kwin_wayland_wrapper, Xwayland, Xorg, plasmashell,
    ksmserver, kded6, kded5, krunner, sddm, sddm-greeter, sddm-greeter-qt6, sddm-greeter-qt,
    gamescope, gamescope-wl, gamescope-session, steamwebhelper, pipewire, wireplumber,
    xdg-desktop-portal, xdg-desktop-portal-kde, systemd, nvidia-powerd, nvidia-persistenced
