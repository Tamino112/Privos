# Standard-Einstellungen für privos-vram-guard.
# Eigene Anpassungen gehören nach /etc/privos/vram-guard.conf (gleiches Format, nur geänderte Werte).

[guard]
# notify     = nur warnen, nie etwas beenden
# balanced   = nur eingreifen, wenn das System wirklich einfriert (Standard).
#              Volles VRAM allein ist kein Grund: Spiele füllen es absichtlich bis zum Rand,
#              und Proton lagert bei Bedarf in den normalen RAM aus.
# aggressive = zusätzlich eingreifen, wenn VRAM lange voll ist, auch ohne Einfrieren
mode = balanced

# Wie oft der VRAM geprüft wird (Sekunden)
poll_interval = 1.0

# Warnung, wenn der VRAM so lange über diesem Wert liegt
warn_percent = 90
warn_seconds = 5
warn_cooldown = 120

# Notfall: VRAM über critical_percent (oder weniger als critical_free_mib frei) UND
# das System stockt für critical_seconds. "Stockt" heißt: Speicherdruck laut PSI oder
# der Desktop (GNOME Shell/Mutter) antwortet nicht innerhalb von desktop_timeout Sekunden.
critical_percent = 97
critical_free_mib = 150
critical_seconds = 3
psi_full_avg10 = 10
psi_some_avg10 = 40
desktop_check = yes
desktop_timeout = 2

# Nur im Modus "aggressive": auch ohne Stocken eingreifen, wenn VRAM
# komplett voll ist (exhausted_seconds) oder lange über critical_percent liegt (aggressive_seconds)
exhausted_seconds = 8
aggressive_seconds = 20

# Spiel-Tipp: startet ein Spiel (ab game_min_mib VRAM) und andere Apps belegen zusammen
# mindestens game_hint_min_mib, nennt eine Benachrichtigung diese Apps. Es wird nichts geschlossen.
game_hint = yes
game_min_mib = 1024
game_hint_min_mib = 400

# Wartezeit zwischen SIGTERM und SIGKILL, und Mindestabstand zwischen zwei Eingriffen
kill_grace_seconds = 3
action_cooldown = 15

# Apps mit weniger VRAM werden nie beendet; Systemprozesse (UID < min_uid) auch nicht
min_victim_mib = 256
min_uid = 1000

# Werden NIE beendet (Prozessname, Programmname oder .exe-Name)
protected = gnome-shell, mutter, gdm, gdm-wayland-session, gdm-x-session, Xwayland, Xorg,
    gnome-session-binary, gnome-session, gnome-settings-daemon, gsd-media-keys,
    gamescope, gamescope-wl, gamescope-session, steamwebhelper, pipewire, wireplumber,
    xdg-desktop-portal, xdg-desktop-portal-gnome, systemd, nvidia-powerd, nvidia-persistenced

[budget]
# VRAM-Budget für Spiele: Proton-Spiele (DirectX 9–12) bekommen gemeldet, die Grafikkarte habe
# reserve_mib weniger VRAM als in Wirklichkeit. Spiele wie ARK laden Texturen dann nur bis zu
# dieser Grenze, und der Desktop behält genug Platz, statt bei vollem VRAM einzufrieren.
# Pro Spiel abschalten: Steam-Startoption  DXVK_CONFIG= %command%
enabled = yes
reserve_mib = 1024
# Bei Karten mit weniger VRAM kein Budget (dort zählt jedes MB fürs Spiel)
min_vram_mib = 4096
