# ZRAM (komprimierter Swap im RAM) ist sehr schnell – der Kernel soll ihn früh nutzen,
# statt bei vollem Speicher alles einzufrieren.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# Viele Spiele (z. B. über Proton) brauchen sehr viele Memory-Maps
vm.max_map_count = 2147483642

# Notfall-Tasten (Magic SysRq): Sync, Read-only-Remount, Prozesse beenden (Alt+SysRq+F = OOM-Kill),
# Neustart. Letzter Ausweg, falls wirklich alles hängt.
kernel.sysrq = 240
