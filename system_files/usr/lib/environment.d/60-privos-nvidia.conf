# Größerer NVIDIA-Shader-Cache (12 GB) und kein automatisches Aufräumen:
# weniger Shader-Ruckler, weil kompilierte Shader nicht ständig verworfen werden.
__GL_SHADER_DISK_CACHE_SIZE=12000000000
__GL_SHADER_DISK_CACHE_SKIP_CLEANUP=1

# DLSS, Reflex und NVIDIA-Features in Proton-Spielen aktivieren
PROTON_ENABLE_NVAPI=1

# Hardware-Videodekodierung (NVDEC) für Browser über nvidia-vaapi-driver
NVD_BACKEND=direct
