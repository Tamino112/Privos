# Privos NVIDIA-Moduloptionen.
# Treiber-Standards (Suspend mit VRAM-Sicherung nach /var/tmp, S0ix, modeset/fbdev)
# kommen bereits aus /usr/lib/modprobe.d/nvidia.conf des Treiberpakets.

# Page Attribute Table: schnellere CPU<->GPU-Speicherzugriffe (Write-Combining über PAT statt MTRR)
options nvidia NVreg_UsePageAttributeTable=1
