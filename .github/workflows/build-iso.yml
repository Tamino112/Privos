name: Build Privos ISO

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image-Tag, aus dem die ISO gebaut wird"
        required: true
        default: latest
  # Nach jedem erfolgreichen Image-Build durch einen Push (nicht beim wöchentlichen Rebuild)
  workflow_run:
    workflows: ["Build Privos image"]
    types: [completed]

env:
  IMAGE_NAME: privos-nvidia

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  iso:
    name: Live-ISO bauen
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Freien Speicher prüfen
        id: space
        run: |
          available_kib="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          if (( available_kib < 50 * 1024 * 1024 )); then
            echo 'cleanup=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Speicherplatz freimachen
        if: steps.space.outputs.cleanup == 'true'
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      - name: Container-Speicher auf Btrfs (komprimiert) einrichten
        run: |
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp /var/lib/containers/storage
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage

      - uses: actions/checkout@v4

      - name: Image bestimmen
        id: ref
        run: |
          tag="${{ inputs.tag || 'latest' }}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          update_tag=latest
          if [[ "${tag}" == br-* ]]; then
            update_tag="${tag}"
          fi
          echo "image=${image}:${tag}" >> "$GITHUB_OUTPUT"
          echo "update=${image}:${update_tag}" >> "$GITHUB_OUTPUT"
          echo "iso=privos-nvidia-${tag}-$(date -u +%Y%m%d)-live-amd64.iso" >> "$GITHUB_OUTPUT"

      - name: Bei GHCR anmelden
        run: echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin --authfile /tmp/auth.json

      - name: Live-System bauen
        run: |
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --authfile /tmp/auth.json \
            --cap-add sys_admin \
            --security-opt label=disable \
            --secret id=registry-auth,src=/tmp/auth.json \
            --build-arg BASE_IMAGE="${{ steps.ref.outputs.image }}" \
            --build-arg PAYLOAD_REF="${{ steps.ref.outputs.image }}" \
            --build-arg UPDATE_REF="${{ steps.ref.outputs.update }}" \
            -t localhost/privos-live:latest installer/

      - name: Speicherplatz anzeigen
        if: always()
        run: sudo df -h

      # Titanoboa ist auf diesen Commit und dessen Prüfsumme fixiert.
      # Nur die Zstandard-Stufe ändert sich: Stufe 19 brauchte rund 6 Minuten
      # für das SquashFS, obwohl das eingebettete Image bereits komprimiert ist.
      - name: ISO erzeugen (Titanoboa, schnelle Kompression)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/privos-iso" upload
          script="${RUNNER_TEMP}/privos-build_iso.sh"
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/ublue-os/titanoboa/5c457c3d0518bd17e754be0fd98a60d29d26abb4/build_iso.sh' \
            -o "$script"
          echo "a73e0a11731880bc6272650371427564aaf565d5dc0d9e51dd793d79b351dcba  $script" | sha256sum -c -
          sed -i 's/-Xcompression-level 19/-Xcompression-level 3/' "$script"
          grep -Fq -- '-comp zstd -Xcompression-level 3' "$script"
          sudo podman run --rm -i \
            --cap-add sys_admin --security-opt label=disable \
            -v "$script:/src/build_iso.sh:ro" \
            --mount type=image,source=localhost/privos-live:latest,dst=/rootfs \
            -v "${RUNNER_TEMP}/privos-iso:/output" \
            quay.io/fedora/fedora:latest /src/build_iso.sh
          sudo chown "$(id -u):$(id -g)" "${RUNNER_TEMP}/privos-iso/Privos-Live.iso"
          mv "${RUNNER_TEMP}/privos-iso/Privos-Live.iso" "upload/${{ steps.ref.outputs.iso }}"
          test -s "upload/${{ steps.ref.outputs.iso }}"

      - name: Prüfsumme
        run: |
          cd upload
          sha256sum *.iso | tee "${{ steps.ref.outputs.iso }}-CHECKSUM"
          ls -lh

      - name: ISO hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ref.outputs.iso }}
          path: upload/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
