  </defs>
  <rect width="3840" height="2160" fill="#EEF0F8"/>
  <g filter="url(#blur)">
    <ellipse cx="2750" cy="620" rx="1050" ry="720" fill="#A78BFA" fill-opacity="0.65"/>
