  </defs>
  <rect width="3840" height="2160" fill="#090A10"/>
  <g filter="url(#blur)">
    <ellipse cx="2750" cy="620" rx="1050" ry="720" fill="#7C3AED" fill-opacity="0.70"/>
    <ellipse cx="3350" cy="1500" rx="700" ry="600" fill="#4F46E5" fill-opacity="0.55"/>
    <ellipse cx="850" cy="1750" rx="950" ry="620" fill="#0891B2" fill-opacity="0.50"/>
    <ellipse cx="1700" cy="1050" rx="520" ry="380" fill="#C026D3" fill-opacity="0.22"/>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="3">
    <path d="M-100 1500 C 800 1150, 1500 1850, 2300 1350 S 3500 800, 3950 1050"/>
    <path d="M-100 1580 C 800 1240, 1500 1930, 2300 1430 S 3500 880, 3950 1130"/>
    <path d="M-100 1660 C 800 1330, 1500 2010, 2300 1510 S 3500 960, 3950 1210"/>
  </g>
  <rect width="3840" height="2160" fill="url(#vignette)"/>
  <rect width="3840" height="2160" filter="url(#grain)" opacity="0.05"/>
